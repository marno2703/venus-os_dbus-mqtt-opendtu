; Minimal configuration for the OpenDTU autodiscovery driver.
; Copy this file to config.ini and set your MQTT broker details.

[MQTT]
; IP address or FQDN of the MQTT broker used by OpenDTU.
broker_address = IP_ADDR_OR_FQDN

; MQTT broker port.
broker_port = 1883

; Optional MQTT credentials. Leave empty when the broker does not require authentication.
username =
password =

; OpenDTU base topic. The driver subscribes to:
;   solar/#
base_topic = solar

[DRIVER]
; Enable verbose diagnostics for MQTT topic parsing, D-Bus updates, and limit writes.
; 0 = normal logging
; 1 = debug logging
debug = 0

; Small safety floor for limits sent to OpenDTU.
; Some Hoymiles inverters may not wake up cleanly after an exact 0 W limit.
; Set to 0 to forward Victron's requested value unchanged.
minimum_limit_watts = 50

; Seconds to wait for OpenDTU status/limit_absolute to confirm a sent limit.
; While waiting, newer ESS writes are held back and only the latest requested value is kept.
limit_confirm_timeout_seconds = 180
