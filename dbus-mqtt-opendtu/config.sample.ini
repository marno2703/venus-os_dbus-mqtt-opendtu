; Minimal configuration for the OpenDTU autodiscovery driver.
; Copy this file to config.ini and set your MQTT broker details.

[MQTT]
; IP address or FQDN of the MQTT broker used by OpenDTU.
broker_address = IP_ADDR_OR_FQDN

; MQTT broker port.
broker_port = 1883

; Optional MQTT credentials. Leave empty when the broker does not require authentication.
username =
password =

; OpenDTU base topic. The driver subscribes to:
;   solar/#
base_topic = solar
